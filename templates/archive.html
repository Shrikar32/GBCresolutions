{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 md:px-0">

    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl shadow-orange-100/50 border border-orange-100 mb-10 relative overflow-hidden">
        
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-orange-50 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-orange-50 rounded-full blur-3xl opacity-50 pointer-events-none"></div>

        <form action="/archive" method="get" id="searchForm" class="relative z-10 flex flex-col gap-5">
            
            <div class="relative w-full group">
                <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none z-10">
                    <i class="fas fa-search text-orange-400 text-xl group-focus-within:text-orange-600 transition-colors"></i>
                </div>
                
                <input type="text" name="q" id="searchInput" value="{{ query or '' }}" 
                       placeholder="Search Keywords..." 
                       class="block w-full pl-14 pr-12 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl text-gray-900 placeholder-gray-400 font-bold text-lg focus:bg-white focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-sm"
                       oninput="toggleClearButton()">

                <button type="button" id="clearSearchBtn" onclick="clearSearch()"
                   class="absolute inset-y-0 right-0 pr-5 flex items-center text-gray-300 hover:text-red-500 transition-colors cursor-pointer z-10 {% if not query %}hidden{% endif %}"
                   title="Clear">
                    <i class="fas fa-times-circle text-2xl"></i>
                </button>
            </div>

            <div class="flex flex-col gap-3">
                
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none z-10">
                        <i class="fas fa-folder text-orange-500/70"></i>
                    </div>
                    <select name="ministry" class="w-full bg-white border-2 border-gray-100 text-gray-700 font-bold text-base rounded-xl focus:border-orange-500 focus:ring-0 block pl-12 pr-10 py-3.5 appearance-none cursor-pointer hover:border-orange-200 transition-colors shadow-sm">
                        <option value="">All Topics</option>
                        {% for m in ministries %}
                        <option value="{{ m }}" {% if selected_ministry == m %}selected{% endif %}>{{ m }}</option>
                        {% endfor %}
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-5 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>

                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none z-10">
                        <i class="fas fa-tag text-orange-500/70"></i>
                    </div>
                    <select name="category" class="w-full bg-white border-2 border-gray-100 text-gray-700 font-bold text-base rounded-xl focus:border-orange-500 focus:ring-0 block pl-12 pr-10 py-3.5 appearance-none cursor-pointer hover:border-orange-200 transition-colors shadow-sm">
                        <option value="">All Categories</option>
                        {% for c in categories %}
                        <option value="{{ c }}" {% if selected_category == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-5 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>

                <div class="relative">
                     <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none z-10">
                        <i class="fas fa-globe text-orange-500/70"></i>
                    </div>
                    <select name="scope" class="w-full bg-white border-2 border-gray-100 text-gray-700 font-bold text-base rounded-xl focus:border-orange-500 focus:ring-0 block pl-12 pr-10 py-3.5 appearance-none cursor-pointer hover:border-orange-200 transition-colors shadow-sm">
                        <option value="">All Scopes</option>
                        {% for s in scopes %}
                        <option value="{{ s }}" {% if selected_scope == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-5 flex items-center pointer-events-none text-gray-400">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
                <button type="submit" class="md:col-span-2 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white py-4 rounded-xl font-extrabold text-lg shadow-lg shadow-orange-200 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-search"></i> SEARCH
                </button>
                
                <a href="/archive" class="flex items-center justify-center py-4 border-2 border-gray-200 text-gray-500 bg-white hover:bg-gray-50 hover:text-gray-800 rounded-xl font-bold text-base transition-colors active:scale-[0.98]">
                    Reset
                </a>
            </div>
        </form>
    </div>

    <div class="flex items-center justify-between px-2 mb-6 border-b border-gray-100 pb-4">
        <h2 class="font-sans text-2xl text-gray-900 font-extrabold tracking-tight">Results</h2>
        <span class="bg-orange-100 text-orange-700 text-sm font-bold px-4 py-1.5 rounded-full shadow-sm">{{ results|length }} Found</span>
    </div>

    <div class="space-y-5">
        {% for r in results %}
        <a href="/page/{{ r.Resolution_ID }}" class="group block bg-white border-2 border-transparent hover:border-orange-400 rounded-2xl p-6 shadow-md shadow-gray-100 hover:shadow-xl hover:shadow-orange-100 transition-all duration-200 relative">
            
            <div class="flex justify-between items-start mb-3">
                <div class="flex items-center gap-3">
                    <span class="font-mono text-xs font-bold tracking-wider text-orange-600 bg-orange-50 px-3 py-1.5 rounded-lg border border-orange-100 group-hover:bg-orange-500 group-hover:text-white transition-colors">
                        {{ r.Resolution_ID }}
                    </span>
                </div>
                <span class="text-xs font-bold text-gray-400 bg-gray-50 px-3 py-1 rounded-full group-hover:text-orange-600 group-hover:bg-orange-50 transition-colors">
                    {{ r.Year }}
                </span>
            </div>
            
            <h3 class="font-sans text-xl font-bold text-gray-900 mb-3 group-hover:text-orange-600 transition-colors leading-tight">
                {{ r.Title }}
            </h3>
            
            <p class="text-sm text-gray-500 font-medium leading-relaxed line-clamp-2">
                {{ r.Full_Text }}
            </p>
        </a>
        {% endfor %}
    </div>

    {% if not results %}
    <div class="flex flex-col items-center justify-center py-20 text-center opacity-70">
        <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-300 text-4xl">
            <i class="fas fa-search"></i>
        </div>
        <h3 class="font-bold text-xl text-gray-800 mb-2">No Results Found</h3>
        <a href="/archive" class="text-orange-500 font-bold hover:underline">Clear Search</a>
    </div>
    {% endif %}
</div>

<script>
    function toggleClearButton() {
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('clearSearchBtn');
        if (input.value.length > 0) {
            btn.classList.remove('hidden');
        } else {
            btn.classList.add('hidden');
        }
    }

    function clearSearch() {
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('clearSearchBtn');
        input.value = '';
        btn.classList.add('hidden');
        input.focus();
    }
</script>
{% endblock %}
