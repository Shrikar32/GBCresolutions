{% extends "base.html" %}

{% block content %}
<div class="flex flex-col min-h-screen relative">

    <div class="md:hidden p-4 bg-white border-b border-gray-200 sticky top-0 z-40 flex items-center shadow-sm">
        <button onclick="toggleTimeline()" class="text-gray-700 hover:bg-gray-100 p-2 rounded focus:outline-none transition-colors">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <span class="ml-3 font-bold text-gray-700 text-lg">Timeline</span>
    </div>

    <main class="flex-1 p-4 md:p-8 overflow-x-hidden">
        
        <div class="bg-white p-6 rounded-3xl shadow-xl shadow-orange-100/50 border border-orange-100 mb-8 relative overflow-hidden">
            
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-orange-50 rounded-full blur-3xl opacity-50 pointer-events-none"></div>

            <form action="/archive" method="get" id="searchForm" class="relative z-10 flex flex-col gap-5">
                
                <div class="relative w-full group">
                    <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none z-10">
                        <i class="fas fa-search text-orange-400 text-xl group-focus-within:text-orange-600 transition-colors"></i>
                    </div>
                    
                    <input type="text" name="q" id="searchInput" value="{{ query or '' }}" 
                           placeholder="Search Keywords..." 
                           class="block w-full pl-14 pr-12 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl text-gray-900 placeholder-gray-400 font-bold text-lg focus:bg-white focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10 transition-all shadow-sm"
                           oninput="toggleClearButton()">

                    <button type="button" id="clearSearchBtn" onclick="clearSearch()"
                       class="absolute inset-y-0 right-0 pr-5 flex items-center text-gray-300 hover:text-red-500 transition-colors cursor-pointer z-10 {% if not query %}hidden{% endif %}">
                        <i class="fas fa-times-circle text-2xl"></i>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <select name="ministry" class="bg-white border-2 border-gray-100 text-gray-700 font-bold rounded-xl focus:border-orange-500 block w-full p-3">
                        <option value="">All Topics</option>
                        {% for m in ministries %}
                        <option value="{{ m }}" {% if selected_ministry == m %}selected{% endif %}>{{ m }}</option>
                        {% endfor %}
                    </select>

                    <select name="category" class="bg-white border-2 border-gray-100 text-gray-700 font-bold rounded-xl focus:border-orange-500 block w-full p-3">
                        <option value="">All Categories</option>
                        {% for c in categories %}
                        <option value="{{ c }}" {% if selected_category == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>

                    <select name="scope" class="bg-white border-2 border-gray-100 text-gray-700 font-bold rounded-xl focus:border-orange-500 block w-full p-3">
                        <option value="">All Scopes</option>
                        {% for s in scopes %}
                        <option value="{{ s }}" {% if selected_scope == s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="flex gap-3">
                    <button type="submit" class="flex-1 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 text-white py-3 rounded-xl font-extrabold shadow-lg shadow-orange-200 transform active:scale-[0.98] transition-all">
                        SEARCH
                    </button>
                    <a href="/archive" class="px-6 py-3 border-2 border-gray-200 text-gray-500 rounded-xl font-bold hover:bg-gray-50 transition-colors">Reset</a>
                </div>
            </form>
        </div>

        <div class="flex items-center justify-between mb-6 border-b border-gray-100 pb-4">
            <h2 class="text-2xl font-extrabold text-gray-900">Results</h2>
            <span class="bg-orange-100 text-orange-700 text-sm font-bold px-4 py-1.5 rounded-full">{{ results|length }} Found</span>
        </div>

        <div class="space-y-4">
            {% for r in results %}
            <a href="/page/{{ r.Resolution_ID }}" class="group block bg-white border border-transparent hover:border-orange-400 rounded-2xl p-6 shadow-sm hover:shadow-xl transition-all relative">
                <div class="flex justify-between items-start mb-2">
                    <span class="font-mono text-xs font-bold text-orange-600 bg-orange-50 px-2 py-1 rounded border border-orange-100">
                        {{ r.Resolution_ID }}
                    </span>
                    <span class="text-xs font-bold text-gray-400">{{ r.Year }}</span>
                </div>
                <h3 class="text-lg font-bold text-gray-900 group-hover:text-orange-600 mb-2 leading-tight">
                    {{ r.Title }}
                </h3>
                <p class="text-sm text-gray-500 line-clamp-2">{{ r.Full_Text }}</p>
            </a>
            {% endfor %}

            {% if not results %}
            <div class="text-center py-20 text-gray-400">
                <i class="fas fa-search text-4xl mb-4"></i>
                <p class="font-bold">No results found.</p>
            </div>
            {% endif %}
        </div>
    </main>
</div>

<script>
    // 1. Toggle Sidebar on Mobile
    // This looks for the <aside> tag in your layout (Left Timeline) and toggles it.
    function toggleTimeline() {
        const sidebar = document.querySelector('aside');
        
        if (sidebar) {
            // Toggle the 'hidden' class to show/hide
            sidebar.classList.toggle('hidden');
            
            // OPTIONAL: If your sidebar doesn't have mobile styles, this helps position it
            if (!sidebar.classList.contains('hidden')) {
                sidebar.classList.add('fixed', 'inset-y-0', 'left-0', 'z-50', 'bg-white', 'shadow-2xl', 'overflow-y-auto');
            } else {
                sidebar.classList.remove('fixed', 'inset-y-0', 'left-0', 'z-50', 'bg-white', 'shadow-2xl', 'overflow-y-auto');
            }
        } else {
            console.error("Sidebar <aside> element not found.");
        }
    }

    // 2. Search Bar Logic
    function toggleClearButton() {
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('clearSearchBtn');
        if (input.value.length > 0) btn.classList.remove('hidden');
        else btn.classList.add('hidden');
    }

    function clearSearch() {
        const input = document.getElementById('searchInput');
        input.value = '';
        toggleClearButton();
        input.focus();
    }
</script>
{% endblock %}
